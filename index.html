<head>

    <title>Huari AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="./src/assets/logos/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="stylesheet" href="./styles/style.css">

<body>
    
    <header>
        
        <div class="navbar">

                <img src="./src/assets/logos/logo.svg" alt="logo-navbar">

            </div>
            <div class="navbar-links">
                <a href="" class="selecionado"><img src="./src/assets/icons/house-orange.svg" alt="icon-inicio">Início</a>

            <div class="main-1-btns">
